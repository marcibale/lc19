<style>
/* Layout: una columna de móvil, pestañas fijas arriba, tarjetas de partido por ronda. Azul pista + amarillo pelota. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --surface-2: #e3eaf0;
  --ink: #0e2233;
  --muted: #526679;
  --line: #cdd8e1;
  --court: #1c5aa6;
  --court-ink: #ffffff;
  --ball: #d6ec45;
  --ball-ink: #1b2a05;
  --warn-bg: #fff2d6;
  --warn-ink: #6b3f00;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1520; --surface: #122233; --surface-2: #1a3047; --ink: #e8f0f6; --muted: #9bb0c2;
    --line: #25405a; --court: #5da3f0; --court-ink: #07192b; --warn-bg: #3a2c0c; --warn-ink: #f3d9a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1520; --surface: #122233; --surface-2: #1a3047; --ink: #e8f0f6; --muted: #9bb0c2;
  --line: #25405a; --court: #5da3f0; --court-ink: #07192b; --warn-bg: #3a2c0c; --warn-ink: #f3d9a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-block: 4px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1 { font: 700 clamp(38px, 11vw, 54px)/0.92 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 18px 0 6px; }
.sub { color: var(--muted); margin: 0 0 14px; font-variant-numeric: tabular-nums; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 16px; }
nav.tabs a { flex: 1; min-width: 0; text-align: center; padding: 12px 2px 10px; font: 600 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--court); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--court); outline-offset: 2px; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }
.toast { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 6; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
h2 { font: 700 26px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 26px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h2 small { font: 500 18px var(--font-display); color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
h3 { font: 700 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
.chip { display: inline-block; font: 600 14px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 5px 8px 4px; border-radius: 4px; background: var(--surface-2); color: var(--ink); }
.chip.now { background: var(--ball); color: var(--ball-ink); }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); cursor: pointer; }
.btn.primary { background: var(--court); color: var(--court-ink); border-color: var(--court); }
.btn.ball { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.btn.danger { color: #b3261e; border-color: #b3261e; }
:root[data-theme="dark"] .btn.danger { color: #ff8f86; border-color: #ff8f86; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #ff8f86; border-color: #ff8f86; } }
.link { background: none; border: 0; color: var(--court); font: 600 15px var(--font-body); padding: 8px 4px; cursor: pointer; text-decoration: underline; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { color: var(--muted); font-size: 14px; margin: 8px 0; }

/* Elegir pareja */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.picker .btn { text-align: left; font-size: 17px; min-height: 56px; }
.whoami { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }

/* Próximo partido */
.hero { background: var(--court); color: var(--court-ink); border-radius: 12px; padding: 18px 18px 20px; }
.hero .kicker { margin: 0 0 6px; font: 600 16px var(--font-display); text-transform: uppercase; letter-spacing: .08em; opacity: .9; }
.hero .when { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.hero .pista { font: 700 clamp(56px, 18vw, 84px)/0.9 var(--font-display); text-transform: uppercase; }
.hero .hora { font: 600 24px var(--font-display); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.hero .vs { margin: 14px 0 2px; font: 500 16px var(--font-display); text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.hero .opp { margin: 0; font: 700 clamp(28px, 8vw, 36px)/1.05 var(--font-display); overflow-wrap: anywhere; }
.hero .note { margin: 12px 0 0; font-size: 14px; opacity: .92; }
.paths { display: grid; gap: 10px; margin-top: 12px; }
.path { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.path .chip { margin-bottom: 8px; }
.path p { margin: 0; }
.path .dest + .dest { margin-top: 8px; }
.path .dest small { color: var(--muted); display: block; font-size: 14px; }

/* Tarjetas de partido */
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.court { display: inline-block; background: var(--court); color: var(--court-ink); font: 700 15px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; padding: 6px 9px 5px; border-radius: 4px; outline: 1px solid rgba(255,255,255,.55); outline-offset: -3px; }
.mlabel { font: 600 17px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.mkind { color: var(--muted); font-size: 13px; }
.mtime { margin-left: auto; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.side { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; min-height: 40px; }
.side + .side { border-top: 1px dashed var(--line); }
.side .nm { min-width: 0; overflow-wrap: anywhere; }
.side .nm small { color: var(--muted); font-size: 13px; }
.side.me .nm { text-decoration: underline; text-decoration-color: var(--court); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.side.win .nm { font-weight: 700; }
.side .score { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
.side:not(.win) .score { color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 1.5px var(--ball-ink); margin-right: 8px; }
.pend { color: var(--muted); font-style: italic; }
.mfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.st { font-size: 13px; color: var(--muted); }
.st.ok { color: var(--ink); font-weight: 600; }
.entry { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.entry label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
.entry label span { overflow-wrap: anywhere; }
.entry input[type=number] { width: 100%; min-height: 56px; text-align: center; font: 700 30px var(--font-display); border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.mine-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mine-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.mine-list .res { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mine-list .res.w::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 1.5px var(--ball-ink); margin-right: 8px; }

/* Organizador */
.org label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.org input[type=text], .org input[type=time], .org input[type=number], .org select { width: 100%; min-height: 44px; padding: 8px 10px; font: 16px var(--font-body); border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.org .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.verse { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 8px; }
.verse blockquote { margin: 0; font: 500 clamp(20px, 5.6vw, 25px)/1.28 var(--font-display); letter-spacing: .01em; }
.verse blockquote::before { content: "\201C"; font-size: 1.6em; line-height: 0; vertical-align: -.35em; margin-right: 4px; color: var(--court); }
.verse figcaption { margin: 8px 0 0; color: var(--muted); font: 600 14px var(--font-body); text-transform: uppercase; letter-spacing: .06em; }
.verse .row { gap: 0 12px; margin-top: 4px; }
.champ { background: var(--ball); color: var(--ball-ink); border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; display: grid; gap: 2px; }
.champ span { font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em; }
.champ b { font: 700 28px/1.1 var(--font-display); overflow-wrap: anywhere; }
.pairrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; margin-bottom: 10px; }
.pairrow > b { font: 700 22px/44px var(--font-display); text-align: center; }
.pcell { min-width: 0; }
.pcell small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.pbtns { display: flex; gap: 4px; }
.btn.sm { min-width: 44px; padding: 0 8px; font-size: 18px; }
.btn:disabled { opacity: .4; cursor: default; }
.seedrow { display: grid; grid-template-columns: 118px 1fr; gap: 10px; align-items: center; }
.seedrow b { font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.seedrow small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; font-family: var(--font-body); text-transform: none; letter-spacing: 0; }
.rules { color: var(--muted); font-size: 14px; padding-left: 18px; margin: 0; }
.rules li + li { margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .08s; } .btn:active { transform: translateY(1px); } }
</style>
</head>

    if (!verseBag.length) {
      verseBag = VERSES.map(function (_, i) { return i; });
      for (var i = verseBag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = verseBag[i]; verseBag[i] = verseBag[j]; verseBag[j] = t; }

  /* ---- Cuadro generado según el número de parejas ----
     Cada partido: lado a/b = puesto del sorteo (seed), ganadora (w) o perdedora (l) de otro partido.
     Cuadro principal con byes para los mejores puestos, consolación para quien pierde antes de semifinales
     y un amistoso entre los perdedores de semifinales. Los partidos se reparten en rondas de 3 pistas. */
  function seedOrder(P) {
    var o = [1, 2];
    while (o.length < P) {
      var n = o.length * 2, next = [];
      o.forEach(function (x) { next.push(x, n + 1 - x); });
      o = next;
    }
    return o;

    var P = n <= 8 ? 8 : 16;
    var entries = seedOrder(P).map(function (x) { return x <= n ? { seed: x } : null; });
    var main = [], cnt = 0, per = {}, i;
    while (entries.length > 1) {
      var stage = entries.length, next = [];
      for (i = 0; i < entries.length; i += 2) {
        var A = entries[i], B = entries[i + 1];
        if (!A || !B) { next.push(A || B); continue; }
        per[stage] = (per[stage] || 0) + 1;
        var id = 'm' + (++cnt);
        main.push({ id: id, kind: 'main', stage: stage, idx: per[stage], a: A, b: B });
        next.push({ w: id });
      }
      entries = next;
    }
    main.forEach(function (m) {
      if (m.stage === 16) { var one = per[16] === 1; m.label = one ? 'Play-in' : 'Play-in ' + m.idx; m.of = 'del ' + m.label; }
      else if (m.stage === 8) { m.label = 'Cuarto ' + m.idx; m.of = 'del ' + m.label; }
      else if (m.stage === 4) { m.label = 'Semifinal ' + m.idx; m.of = 'de la ' + m.label; }
      else { m.label = 'Final'; m.of = 'de la Final'; m.final = true; }
    });

    var slotOf = {}, slots = [null], rem = main.slice(), s = 0;
    function take(list, free) {
      var pick = [];
      list.forEach(function (m) {
        if (pick.length < free && depsOf(m).every(function (d) { return slotOf[d] && slotOf[d] < s; })) pick.push(m);
      });
      return pick;
    }
    while (rem.length && s < 60) {
      s++;
      var pick = take(rem, COURTS);
      pick.forEach(function (m) { slotOf[m.id] = s; m.round = s; });
      rem = rem.filter(function (m) { return pick.indexOf(m) < 0; });
      slots.push(pick);
    }

    // Perdedores de las rondas previas a semifinales, ordenados por cuándo se conocen
    var losers = main.filter(function (m) { return m.stage >= 8; }).sort(function (x, y) {
      return x.round - y.round || main.indexOf(x) - main.indexOf(y);
    });
    var semis = main.filter(function (m) { return m.stage === 4; });
    var todo = [{ id: 'm' + (++cnt), kind: 'fun', label: 'Amistoso', of: 'del Amistoso', a: { l: semis[0].id }, b: { l: semis[1].id } }];
    var cons = [], ci = 0;
    function mk(a, b) { ci++; var c = { id: 'm' + (++cnt), kind: 'cons', label: 'Consolación ' + ci, of: 'de la Consolación ' + ci, a: a, b: b }; cons.push(c); }
    for (i = 0; i + 1 < losers.length; i += 2) mk({ l: losers[i].id }, { l: losers[i + 1].id });
    if (losers.length % 2 === 1) mk({ l: losers[losers.length - 1].id }, { w: cons[0].id });
    todo = todo.concat(cons);

    s = 0;
    while (todo.length && s < 60) {
      s++;
      if (!slots[s]) slots[s] = [];
      var pickB = take(todo, COURTS - slots[s].length);
      pickB.forEach(function (m) { slotOf[m.id] = s; m.round = s; slots[s].push(m); });
      todo = todo.filter(function (m) { return pickB.indexOf(m) < 0; });
    }

    var matches = [], by = {};
    for (var k = 1; k < slots.length; k++) {
      (slots[k] || []).forEach(function (m, ix) { m.court = ix + 1; m.round = k; matches.push(m); by[m.id] = m; });
    }
    return { matches: matches, by: by, slots: slots.length - 1 };
  }
  var STRUCT_CACHE = {};
  function struct(n) { if (!STRUCT_CACHE[n]) STRUCT_CACHE[n] = build(n); return STRUCT_CACHE[n]; }
  var MATCHES = [], BY = {}, NSLOTS = 4;

  /* Horario: 10 min de calentamiento y rondas iguales. Cada ronda ocupa lo que cabe en las horas
     contratadas, entre 20 y 50 min (de ellos 5 de cambio de pista). Lo que sobra queda de pista libre. */
  var ROUND_OFF = {}, END_OFF = 0, SLOT = 35;
  function calcTiming(hours, slotsCount) {
    var total = Math.round(hours * 60), S = slotsCount || 4;
    var slot = Math.max(20, Math.min(50, Math.floor((total - 10) / S / 5) * 5));
    return { total: total, slot: slot, end: 10 + S * slot };
  }
  function applyTiming() {
    var st = struct(state.cfg.order.length);
    MATCHES = st.matches; BY = st.by; NSLOTS = st.slots;
    var t = calcTiming(state.cfg.hours, NSLOTS);
    SLOT = t.slot; END_OFF = t.end; ROUND_OFF = {};
    for (var r = 1; r <= NSLOTS; r++) ROUND_OFF[r] = 10 + (r - 1) * t.slot;
  }

  function defaults() {
    var names = {}, order = [];
    for (var k = 1; k <= 9; k++) { names['p' + k] = 'Pareja ' + k; order.push('p' + k); }
    return { names: names, order: order, start: '10:00', hours: 4, drawn: false };
  }

  var state = {
    cfg: defaults(), results: {}, db: null, canWrite: false, canEdit: false,
    me: null, verse: null, tab: 'mi-pareja', editing: null, form: { a: '', b: '' },
    msg: '', slow: false, synced: false, draft: null, dirty: false, confirmReset: false
  };
  state.draft = clone(state.cfg);

  var root = document.getElementById('root');
  var tabsEl = document.getElementById('tabs');
  var subEl = document.getElementById('sub');

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }

  function timeAt(off, startStr) {
    var p = (startStr || state.cfg.start || '10:00').split(':');
    var t = (parseInt(p[0], 10) * 60 + parseInt(p[1], 10) + off) % 1440;
    var h = Math.floor(t / 60), m = t % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function normCfg(d) {
    var base = defaults();
    var order = d && Array.isArray(d.order) ? d.order.filter(function (x, k, a) {
      return typeof x === 'string' && /^p\d{1,3}$/.test(x) && a.indexOf(x) === k;
    }) : [];
    if (order.length < MIN_PAIRS || order.length > MAX_PAIRS) order = base.order.slice();
    var names = {};
    order.forEach(function (id) {
      var n = d && d.names && typeof d.names[id] === 'string' ? d.names[id].trim() : '';
      names[id] = n || ('Pareja ' + id.slice(1));
    });
    var start = d && /^\d{1,2}:\d{2}$/.test(d.start || '') ? d.start : base.start;
    var hrs = d ? Number(d.hours) : NaN;
    if (!(hrs >= 1 && hrs <= 12)) hrs = base.hours;
    return { names: names, order: order, start: start, hours: hrs, drawn: !!(d && d.drawn) };
  }

  /* Calcula quién juega cada partido según los resultados. */
  function compute() {
    var out = {};
    function side(ref) {
      if (ref.seed) {
        var id = state.cfg.order[ref.seed - 1];
        return { id: id, name: state.cfg.names[id] };
      }
      var key = ref.w || ref.l;
      var v = out[key];
      if (v && v.done) return ref.w ? v.winner : v.loser;
      return { id: null, pending: (ref.w ? 'la ganadora ' : 'la perdedora ') + BY[key].of };
    }
    MATCHES.forEach(function (m) {
      var A = side(m.a), B = side(m.b), r = state.results[m.id];
      var done = false, winner = null, loser = null;
      if (r && A.id && B.id && isFinite(r.a) && isFinite(r.b) && r.a !== r.b) {
        done = true;
        if (r.a > r.b) { winner = A; loser = B; } else { winner = B; loser = A; }
      }
      out[m.id] = { m: m, A: A, B: B, r: r, done: done, winner: winner, loser: loser, ready: !!(A.id && B.id) };
    });
    return out;
  }

  function nameOf(s) { return s.id ? esc(s.name) : '<span class="pend">' + esc(cap(s.pending)) + '</span>'; }
  function rivalText(s) { return s.id ? '<b>' + esc(s.name) + '</b>' : esc(s.pending); }
  function whenOf(m) { return 'Ronda ' + m.round + ' · ' + timeAt(ROUND_OFF[m.round]); }

  function canEnter(v) {
    if (!state.canWrite || !v.ready) return false;
    return state.canEdit || (!!state.me && (v.A.id === state.me || v.B.id === state.me));
  }

  function entryBlock(v) {
    if (state.editing === v.m.id) {
      return '<form class="entry" data-form="result">' +
        '<div class="entry-grid">' +
        '<label><span>' + esc(v.A.name) + '</span><input id="sa" type="number" inputmode="numeric" min="0" max="30" value="' + esc(state.form.a) + '"></label>' +
        '<label><span>' + esc(v.B.name) + '</span><input id="sb" type="number" inputmode="numeric" min="0" max="30" value="' + esc(state.form.b) + '"></label>' +
        '</div>' +
        '<p class="hint">Juegos de cada pareja cuando suena la alarma. Si hay empate, jugad un punto de oro y sumad ese juego a la ganadora.</p>' +
        '<div class="row"><button class="btn primary" type="submit">Guardar</button>' +
        '<button class="btn" type="button" data-act="cancel">Cancelar</button>' +
        (state.canEdit && v.r ? '<button class="btn danger" type="button" data-act="del" data-id="' + v.m.id + '">Borrar resultado</button>' : '') +
        '</div></form>';
    }
    return '';
  }

  function matchCard(v) {
    var m = v.m, me = state.me, r = v.done ? v.r : null;
    function row(S, score, win) {
      var mine = S.id && S.id === me;
      return '<div class="side' + (win ? ' win' : '') + (mine ? ' me' : '') + '"><span class="nm">' +
        (win ? '<i class="dot" aria-hidden="true"></i>' : '') + nameOf(S) + (mine ? ' <small>(tú)</small>' : '') +
        '</span><span class="score">' + (score == null ? '–' : esc(score)) + '</span></div>';
    }
    var aw = v.done && v.r.a > v.r.b, bw = v.done && v.r.b > v.r.a;
    var st = v.done ? '<span class="st ok">Jugado</span>' : (v.ready ? '<span class="st">Por jugar</span>' : '<span class="st">Esperando rivales</span>');
    var btn = '';
    if (canEnter(v) && state.editing !== m.id) {
      btn = '<button class="btn' + (v.done ? '' : ' primary') + '" data-act="edit" data-id="' + m.id + '">' + (v.done ? 'Corregir' : 'Apuntar resultado') + '</button>';
    }
    return '<article class="match"><div class="mhead"><span class="court">Pista ' + m.court + '</span>' +
      '<span class="mlabel">' + esc(m.label) + '</span><span class="mkind">' + KIND[m.kind] + '</span>' +
      '<span class="mtime">' + timeAt(ROUND_OFF[m.round]) + '</span></div>' +
      row(v.A, r ? r.a : null, aw) + row(v.B, r ? r.b : null, bw) +
      '<div class="mfoot">' + st + btn + '</div>' + entryBlock(v) + '</article>';
  }

  /* ---- Vista: mi pareja ---- */
  function picker() {
    var h = '<div class="card"><h3 style="margin-top:0">¿Quiénes sois?</h3><p class="hint" style="margin-top:0">Elige tu pareja para ver a qué pista ir y contra quién jugáis. Se queda guardado en este móvil.</p><div class="picker">';
    state.cfg.order.forEach(function (id) {
      h += '<button class="btn" data-act="pick" data-id="' + id + '">' + esc(state.cfg.names[id]) + '</button>';
    });
    return h + '</div></div>';
  }

  function pathHtml(kind, v, C) {
    var chip = kind === 'w' ? '<span class="chip now">Si ganáis</span>' : '<span class="chip">Si perdéis</span>';
    var dests = MATCHES.filter(function (m) { return m.a[kind] === v.m.id || m.b[kind] === v.m.id; });
    var body;
    if (!dests.length) {
      if (v.m.final) body = '<p>' + (kind === 'w' ? '¡Campeones del torneo!' : 'Subcampeones. ¡Gran torneo!') + '</p>';
      else body = '<p>Aquí termina vuestro torneo. Las pistas libres son para jugar lo que queráis.</p>';
    } else {
      body = dests.map(function (m) {
        var D = C[m.id];
        var other = m.a[kind] === v.m.id ? D.B : D.A;
        return '<p class="dest"><b>' + esc(m.label) + '</b> · Pista ' + m.court + '<small>' + whenOf(m) + ' · contra ' + rivalText(other).replace(/<\/?b>/g, '') + '</small></p>';
      }).join('');
    }
    return '<div class="path">' + chip + body + '</div>';
  }

  function viewMine(C) {
    var me = state.me;
    if (!me || state.cfg.order.indexOf(me) < 0) return picker();
    var mine = MATCHES.map(function (m) { return C[m.id]; }).filter(function (v) { return v.A.id === me || v.B.id === me; });
    var next = mine.filter(function (v) { return !v.done; })[0];
    var h = '<div class="whoami"><span>Sois <b>' + esc(state.cfg.names[me]) + '</b></span><button class="link" data-act="change-me">Cambiar</button></div>';
    var played = mine.filter(function (v) { return v.done; });
    h += verseHtml() + championHtml(C);

    if (next) {
      var opp = next.A.id === me ? next.B : next.A;
      h += '<section class="hero"><p class="kicker">Vuestro próximo partido · ' + esc(next.m.label) + '</p>' +
        '<div class="when"><span class="pista">Pista ' + next.m.court + '</span><span class="hora">' + whenOf(next.m) + '</span></div>' +
        countdownHtml(next.m) + '<p class="vs">contra</p><p class="opp">' + (opp.id ? esc(opp.name) : esc(cap(opp.pending))) + '</p>';
      if (!played.length && next.m.round > 1) h += '<p class="note">Empezáis en la ronda ' + next.m.round + '. Hasta entonces, a calentar o a jugar libre.</p>';
      if (!next.ready) h += '<p class="note">El rival se sabrá cuando acabe ese partido. Mirad la pestaña Partidos.</p>';
      h += '</section>';
      if (canEnter(next)) {
        h += '<div class="card" style="margin-top:12px">' +
          (state.editing === next.m.id ? '' : '<p style="margin:0 0 10px">¿Ya habéis jugado? Apuntad el resultado.</p><button class="btn ball" data-act="edit" data-id="' + next.m.id + '">Apuntar resultado</button>') +
          entryBlock(next) + '</div>';
      }
      h += '<div class="paths">' + pathHtml('w', next, C) + pathHtml('l', next, C) + '</div>';
    } else {
      var wins = played.filter(function (v) { return v.winner.id === me; }).length;
      h += '<section class="hero"><p class="kicker">Torneo terminado para vosotros</p><p class="opp">' + wins + ' ' + (wins === 1 ? 'victoria' : 'victorias') + ' en ' + played.length + ' ' + (played.length === 1 ? 'partido' : 'partidos') + '</p>' +
        '<p class="note">Gracias por jugar. Las pistas libres están para lo que queráis.</p></section>';
    }

    if (played.length) {
      h += '<h3>Vuestros partidos</h3><ul class="mine-list">';
      played.forEach(function (v) {
        var isA = v.A.id === me, my = isA ? v.r.a : v.r.b, their = isA ? v.r.b : v.r.a;
        var rival = isA ? v.B : v.A;
        h += '<li><span><b>' + esc(v.m.label) + '</b><br><span class="st">contra ' + esc(rival.name) + '</span></span><span class="res' + (my > their ? ' w' : '') + '">' + my + '–' + their + '</span></li>';
      });
      h += '</ul>';
    }
    return h;
  }

  /* ---- Vista: partidos ---- */
  function viewMatches(C) {
    var pendingRounds = MATCHES.filter(function (m) { return !C[m.id].done; }).map(function (m) { return m.round; });
    var cur = pendingRounds.length ? Math.min.apply(null, pendingRounds) : 0;
    var h = championHtml(C) + '<p class="hint" style="margin-top:0">Llegada y calentamiento a las <b>' + timeAt(0) + '</b>. Cada partido dura ' + (SLOT - 5) + ' minutos más 5 de cambio.</p>';
    Array.apply(null, Array(NSLOTS)).map(function (_, k) { return k + 1; }).forEach(function (r) {
      h += '<h2>Ronda ' + r + ' <small>' + timeAt(ROUND_OFF[r]) + '</small>' + (r === cur ? '<span class="chip now">Siguiente</span>' : '') + '</h2>';
      MATCHES.filter(function (m) { return m.round === r; }).forEach(function (m) { h += matchCard(C[m.id]); });
    });
    var total = Math.round(state.cfg.hours * 60), free = total - END_OFF;
    h += '<h2>Fin previsto <small>' + timeAt(END_OFF) + '</small></h2>' +
      '<ul class="rules"><li>Un set a tiempo fijo: al sonar la alarma gana quien lleve más juegos.</li>' +
      '<li>Si hay empate, un punto de oro y el juego va a quien lo gane.</li>' +
      '<li>' + (free > 0
        ? 'Después de la ronda 4 quedan ' + free + ' minutos con las pistas libres, hasta las ' + timeAt(total) + '.'
        : 'Las pistas están contratadas hasta las ' + timeAt(total) + '.') + '</li></ul>';
    return h;
  }

  /* ---- Vista: organizador ---- */
  function hasResults() { return Object.keys(state.results).length > 0; }
  function firstSlot(st, seed) {
    var r = 99;
    st.matches.forEach(function (m) { if ((m.a.seed === seed || m.b.seed === seed) && m.round < r) r = m.round; });
    return r;
  }

  function viewOrg() {
    var d = state.draft, n = d.order.length, st = struct(n);
    var T = calcTiming(d.hours, st.slots), freeMin = Math.round(d.hours * 60) - T.end;
    var stt = d.start.length === 4 ? '0' + d.start : d.start;
    var locked = hasResults();
    var h = '<div class="org">';

    h += '<div class="card"><h3 style="margin-top:0">Horario</h3><div class="grid">' +
      '<label>Hora de inicio<input type="time" data-start value="' + esc(stt) + '"></label>' +
      '<label>Horas de pista contratadas<input type="number" step="0.5" min="1" max="12" inputmode="decimal" data-hours value="' + esc(d.hours) + '"></label></div>' +
      '<p class="hint" style="margin-bottom:0">Primero 10 min de calentamiento y después ' + st.slots + ' rondas de ' + T.slot + ' min (' + (T.slot - 5) + ' de juego y 5 de cambio). ' +
      'El torneo acaba a las <b>' + timeAt(T.end, d.start) + '</b>' +
      (freeMin > 0 ? ' y quedan ' + freeMin + ' min de pista libre hasta las ' + timeAt(Math.round(d.hours * 60), d.start) + '.' : '.') +
      (freeMin < 0 ? ' No cabe en las horas contratadas: pasa ' + (-freeMin) + ' min.' : '') + ' Guarda para que lo vean todos.</p></div>';

    h += '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Parejas (' + n + ')</h3>' +
      '<p class="hint" style="margin-top:0">El puesto decide el cuadro: los primeros descansan al principio y los últimos juegan antes. Cambia el orden con las flechas.</p>';
    d.order.forEach(function (id, i) {
      var f = firstSlot(st, i + 1);
      h += '<div class="pairrow"><b>' + (i + 1) + '</b><div class="pcell"><input type="text" maxlength="40" data-name="' + id + '" value="' + esc(d.names[id]) + '" aria-label="Pareja del puesto ' + (i + 1) + '">' +
        '<small>' + (f === 1 ? 'juega en la ronda 1' : 'descansa en la ronda 1') + '</small></div><div class="pbtns">' +
        '<button class="btn sm" data-act="move-up" data-i="' + i + '"' + (locked || i === 0 ? ' disabled' : '') + ' aria-label="Subir puesto">↑</button>' +
        '<button class="btn sm" data-act="move-down" data-i="' + i + '"' + (locked || i === n - 1 ? ' disabled' : '') + ' aria-label="Bajar puesto">↓</button>' +
        '<button class="btn sm danger" data-act="remove-pair" data-i="' + i + '"' + (locked || n <= MIN_PAIRS ? ' disabled' : '') + ' aria-label="Quitar pareja">×</button></div></div>';
    });
    h += '<div class="row" style="margin-top:4px"><button class="btn" data-act="add-pair"' + (locked || n >= MAX_PAIRS ? ' disabled' : '') + '>Añadir pareja</button></div>' +
      '<p class="hint" style="margin-bottom:0">' + (locked
        ? 'Ya hay resultados apuntados: no se puede cambiar el número ni el orden de las parejas. Reinicia el torneo para hacerlo.'
        : 'Entre ' + MIN_PAIRS + ' y ' + MAX_PAIRS + ' parejas. Pulsa Guardar para que lo vean todos.') + '</p></div>';

    h += '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="save-cfg">Guardar</button>' +
      '<button class="btn ball" data-act="shuffle"' + (locked ? ' disabled' : '') + '>Sortear al azar y guardar</button></div>' +
      '<p class="hint">' + (state.cfg.drawn ? 'Sorteo hecho.' : 'Todavía no hay sorteo guardado.') + '</p>';

    h += '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Reiniciar</h3>' +
      '<p class="hint" style="margin-top:0">Para cuando acabe el torneo y quieras volver a usar la web.</p>';
    if (state.confirmReset) {
      var full = state.confirmReset === 'full';
      h += '<p style="margin-top:0">' + (full
        ? 'Se borrarán todos los resultados y las parejas volverán a "Pareja 1" a "Pareja 9". ¿Seguro?'
        : 'Se borrarán todos los resultados y se mantienen las parejas. ¿Seguro?') + '</p>' +
        '<div class="row"><button class="btn danger" data-act="reset-go">Sí, reiniciar</button><button class="btn" data-act="reset-cancel">No</button></div>';
    } else {
      h += '<div class="row"><button class="btn danger" data-act="reset">Reiniciar torneo (mantener parejas)</button>' +
        '<button class="btn danger" data-act="reset-full">Reiniciar todo (parejas nuevas)</button></div>';
    }
    return h + '</div></div>';
  }

  /* ---- Render ---- */
  var pendingRender = false;
  function render(force) {
    var ae = document.activeElement;
    if (!force && ae && /^(INPUT|SELECT)$/.test(ae.tagName) && root.contains(ae)) { pendingRender = true; return; }
    pendingRender = false;
    applyTiming();

    var tabs = TABS.filter(function (t) { return t[0] !== 'organizador' || state.canEdit; });
    if (!tabs.some(function (t) { return t[0] === state.tab; })) state.tab = 'mi-pareja';
    tabsEl.innerHTML = tabs.map(function (t) {
      return '<a href="#' + t[0] + '"' + (t[0] === state.tab ? ' aria-current="page"' : '') + '>' + t[1] + '</a>';
    }).join('');
    subEl.textContent = state.cfg.order.length + ' parejas · 3 pistas · de ' + timeAt(0) + ' a ' + timeAt(Math.round(state.cfg.hours * 60));

    var C = compute(), h = '';
    if (state.msg) h += '<div class="toast" role="status">' + esc(state.msg) + '</div>';
    if (!state.db) h += '<div class="banner">' + (state.setup ? 'Falta pegar la configuración de Firebase en index.html (mira la guía).' : 'No se pudo conectar con la base de datos. Revisa la conexión y recarga.') + '</div>';
    else if (state.slow && !state.synced) h += '<div class="banner">Todavía no se alcanzan los datos. Lo que ves puede no estar al día.</div>';
    if (state.db && state.synced && !state.cfg.drawn) h += '<div class="banner">El sorteo aún no está hecho: los puestos son provisionales.</div>';
    if (state.db && state.synced && !state.canWrite && state.tab !== 'organizador') h += '<div class="banner">Puedes ver el cuadro pero no apuntar resultados desde esta cuenta. Díselo al organizador.</div>';

    if (state.tab === 'partidos') h += viewMatches(C);
    else if (state.tab === 'organizador') h += viewOrg();
    else h += viewMine(C);
    if (state.db) {
      if (state.canEdit) h += '<p class="hint"><button class="link" data-act="org-logout">Salir del modo organizador</button></p>';
      else h += '<p class="hint"><button class="link" data-act="org-login">Acceso organizador</button>' + (state.authUser && state.authUser.email ? ' · ' + esc(state.authUser.email) + ' no tiene permiso' : '') + '</p>';
    }
    root.innerHTML = h;
  }

  function flash(text) {
    state.msg = text;
    render(true);
    setTimeout(function () { if (state.msg === text) { state.msg = ''; render(); } }, 4000);
  }

  /* ---- Acciones ---- */
  async function saveResult() {
    var v = compute()[state.editing];
    var a = parseInt(state.form.a, 10), b = parseInt(state.form.b, 10);
    if (!(a >= 0 && b >= 0 && a <= 30 && b <= 30)) return flash('Escribe los juegos de las dos parejas.');
    if (a === b) return flash('No puede haber empate: sumad el juego de oro a quien lo gane.');
    if (!v || !v.ready) return flash('Todavía no se sabe quién juega este partido.');
    try {
      await state.db.doc('resultados/' + v.m.id).set({ a: a, b: b, t: Date.now() });
      state.editing = null;
      flash('Resultado guardado.');
    } catch (e) {
      if (e && e.code === 'invalid_argument') { state.canWrite = false; flash('Esta cuenta no puede apuntar resultados. Díselo al organizador.'); }
      else flash('No se pudo guardar. Inténtalo otra vez.');
    }
  }

  async function saveCfg(shuffle) {
    var d = state.draft;
    if (shuffle) {
      var o = d.order.slice();
      for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = o[i]; o[i] = o[j]; o[j] = t; }
      d.order = o;
    }
    if (d.order.length < MIN_PAIRS || d.order.length > MAX_PAIRS) return flash('Tiene que haber entre ' + MIN_PAIRS + ' y ' + MAX_PAIRS + ' parejas.');
    if (hasResults() && d.order.join() !== state.cfg.order.join()) return flash('Ya hay resultados: reinicia el torneo para cambiar las parejas o el orden.');
    var cfg = normCfg({ names: d.names, order: d.order, start: d.start, hours: d.hours, drawn: shuffle ? true : state.cfg.drawn });
    try {
      await state.db.doc('torneo/config').set(cfg);
      state.cfg = cfg; state.draft = clone(cfg); state.dirty = false;
      flash(shuffle ? 'Sorteo hecho y guardado.' : 'Guardado.');
    } catch (e) { flash('No se pudo guardar. Inténtalo otra vez.'); }
  }

  async function resetAll(full) {
    try {
      var snap = await state.db.collection('resultados').get();
      for (var i = 0; i < snap.docs.length; i++) await state.db.doc('resultados/' + snap.docs[i].id).delete();
      var base = full ? defaults() : state.cfg;
      var cfg = normCfg({ names: base.names, order: base.order, start: state.cfg.start, hours: state.cfg.hours, drawn: false });
      await state.db.doc('torneo/config').set(cfg);
      state.cfg = cfg; state.draft = clone(cfg); state.dirty = false;
      state.confirmReset = null; state.editing = null;
      flash(full ? 'Torneo reiniciado con parejas nuevas.' : 'Torneo reiniciado. Se mantienen las parejas.');
    } catch (e) { flash('No se pudo reiniciar. Inténtalo otra vez.'); }
  }

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'pick') { state.me = id; lsSet('padel.pareja', id); state.verse = randVerse(-1); render(true); }
    else if (act === 'verse-next') { state.verse = randVerse(state.verse); render(true); }
    else if (act === 'verse-close') { state.verse = null; render(true); }
    else if (act === 'change-me') { state.me = null; lsSet('padel.pareja', ''); render(true); }
    else if (act === 'edit') {
      var v = compute()[id];
      state.editing = id;
      state.form = { a: v.done ? String(v.r.a) : '', b: v.done ? String(v.r.b) : '' };
      render(true);
      var sa = document.getElementById('sa'); if (sa) sa.focus();
    }
    else if (act === 'cancel') { state.editing = null; render(true); }
    else if (act === 'del') {
      state.db.doc('resultados/' + id).delete().then(function () { state.editing = null; flash('Resultado borrado.'); }, function () { flash('No se pudo borrar.'); });
    }
    else if (act === 'save-cfg') saveCfg(false);
    else if (act === 'shuffle') saveCfg(true);
    else if (act === 'reset') { state.confirmReset = 'soft'; render(true); }
    else if (act === 'reset-full') { state.confirmReset = 'full'; render(true); }
    else if (act === 'reset-cancel') { state.confirmReset = null; render(true); }
    else if (act === 'reset-go') resetAll(state.confirmReset === 'full');
    else if (act === 'org-login') { state.F.login().catch(function () { flash('No se pudo iniciar sesión. Abre la web en Chrome o Safari.'); }); }
    else if (act === 'org-logout') { state.F.logout(); }
    else if (act === 'add-pair' || act === 'remove-pair' || act === 'move-up' || act === 'move-down') {
      var dr = state.draft, ix = parseInt(el.getAttribute('data-i'), 10);
      if (hasResults()) return;
      if (act === 'add-pair' && dr.order.length < MAX_PAIRS) {
        var k = 1; while (dr.order.indexOf('p' + k) >= 0) k++;
        dr.order.push('p' + k); dr.names['p' + k] = 'Pareja ' + k;
      } else if (act === 'remove-pair' && dr.order.length > MIN_PAIRS) {
        delete dr.names[dr.order[ix]]; dr.order.splice(ix, 1);
      } else if (act === 'move-up' && ix > 0) {
        var t1 = dr.order[ix]; dr.order[ix] = dr.order[ix - 1]; dr.order[ix - 1] = t1;
      } else if (act === 'move-down' && ix < dr.order.length - 1) {
        var t2 = dr.order[ix]; dr.order[ix] = dr.order[ix + 1]; dr.order[ix + 1] = t2;
      }
      state.dirty = true; render(true);
    }
  });
  root.addEventListener('submit', function (ev) { ev.preventDefault(); saveResult(); });
  root.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'sa') state.form.a = t.value;
    else if (t.id === 'sb') state.form.b = t.value;
    else if (t.hasAttribute('data-name')) { state.draft.names[t.getAttribute('data-name')] = t.value; state.dirty = true; }
    else if (t.hasAttribute('data-start')) { if (t.value) state.draft.start = t.value; state.dirty = true; }
    else if (t.hasAttribute('data-hours')) { var n = parseFloat(String(t.value).replace(',', '.')); if (n >= 1 && n <= 12) state.draft.hours = n; state.dirty = true; }
  });
  root.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-seed')) { state.draft.order[parseInt(t.getAttribute('data-seed'), 10)] = t.value; state.dirty = true; }
  });
  root.addEventListener('focusout', function () {
    if (!pendingRender) return;
    setTimeout(function () {
      var ae = document.activeElement;
      if (pendingRender && !(ae && /^(INPUT|SELECT)$/.test(ae.tagName) && root.contains(ae))) render(true);
    }, 300);
  });

  function readHash() {
    var h = (location.hash || '').replace('#', '');
    state.tab = TABS.some(function (t) { return t[0] === h; }) ? h : 'mi-pareja';
    render(true);
  }
  window.addEventListener('hashchange', readHash);

  /* ---- Firebase (se carga al arrancar; si falla, la página sigue mostrándose) ---- */
  function wrapErr(e) {
    return { code: e && e.code === 'permission-denied' ? 'invalid_argument' : ((e && e.code) || 'unknown'), message: e && e.message };
  }
  async function loadFirebase() {
    var V = 'https://www.gstatic.com/firebasejs/10.14.1/';
    var m = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-firestore.js'), import(V + 'firebase-auth.js')]);
    var A = m[0], S = m[1], U = m[2];
    var app = A.initializeApp(FIREBASE_CONFIG), fdb = S.getFirestore(app), auth = U.getAuth(app);
    function docs(s) { return s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }); }
    var db = {
      doc: function (p) {
        var r = S.doc(fdb, p);
        return {
          set: function (d) { return S.setDoc(r, d).catch(function (e) { throw wrapErr(e); }); },
          delete: function () { return S.deleteDoc(r).catch(function (e) { throw wrapErr(e); }); },
          onSnapshot: function (next, err) {
            return S.onSnapshot(r, function (s) { next({ exists: s.exists(), data: function () { return s.data(); }, metadata: s.metadata }); }, function (e) { if (err) err(wrapErr(e)); });
          }
        };
      },
      collection: function (p) {
        var c = S.collection(fdb, p);
        return {
          get: async function () { try { return { docs: docs(await S.getDocs(c)) }; } catch (e) { throw wrapErr(e); } },
          onSnapshot: function (next, err) {
            return S.onSnapshot(c, function (s) { next({ docs: docs(s), metadata: s.metadata }); }, function (e) { if (err) err(wrapErr(e)); });
          }
        };
      }
    };
    return {
      db: db,
      onAuth: function (cb) { U.onAuthStateChanged(auth, cb); },
      login: function () { return U.signInWithPopup(auth, new U.GoogleAuthProvider()); },
      logout: function () { return U.signOut(auth); }
    };
  }

  /* ---- Arranque ---- */
  async function boot() {
    var saved = lsGet('padel.pareja');
    if (saved) state.me = saved;
    readHash();

    if (!FIREBASE_CONFIG.apiKey || /^PEGA/.test(FIREBASE_CONFIG.apiKey)) { state.setup = true; render(true); return; }
    var F = null;
    try { F = await loadFirebase(); } catch (e) { render(true); return; }
    state.F = F; state.db = F.db; state.canWrite = true;
    var timer = setTimeout(function () { state.slow = true; render(); }, 10000);

    F.onAuth(function (u) {
      state.authUser = u;
      state.canEdit = !!(u && u.email && u.email.toLowerCase() === ORGANIZER_EMAIL.toLowerCase());
      render();
    });

    F.db.doc('torneo/config').onSnapshot(function (snap) {
      if (!snap.metadata.fromCache) { clearTimeout(timer); state.synced = true; state.slow = false; }
      state.cfg = normCfg(snap.exists ? snap.data() : null);
      if (!state.dirty) state.draft = clone(state.cfg);
      render();
    }, function () { state.slow = true; render(); });

    F.db.collection('resultados').onSnapshot(function (snap) {
      var res = {};
      snap.docs.forEach(function (d) { var x = d.data(); res[d.id] = { a: x.a, b: x.b }; });
      state.results = res;
      render();
    }, function () { state.slow = true; render(); });
    render(true);
  }
  boot();
})();
</script>
</body>
</html>
